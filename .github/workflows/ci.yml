# Tests automatiques à chaque envoi de code + petite production de contrôle (basse résolution).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-studio
      - name: Tests unitaires
        run: npm test
      - name: Construction de l'interface
        run: npm run build

  production-test:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-studio
      - name: Production de contrôle (540×960)
        run: node scripts/produce.js --category facts --count 1 --duration 30 --width 540
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/*.srt
            output/**/*.png
            output/**/*.json
            output/summary.md
          retention-days: 3
          if-no-files-found: warn
